<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/font.css">

  <title>Frontend Mentor | Tip calculator app</title>
  <script src="index.js" defer></script>
</head>

<body>
  <header id="title">
    <img src="images/logo.svg" alt="">
  </header>

  <main id="container">
    <form id="form" novalidate>
      <div class="inputs">
        <div class="bill-details">
          <label for="bill">
            Bill
          </label>
          <br>
          <div class="input-wrapper">
            <img src="images/icon-dollar.svg" alt="dollar icon" class="input-icon">
            <input type="text" name="bill" id="bill" placeholder="0">
          </div>
        </div>

        <div class="tip-details">
          <label for="customTip">Select Tip %</label><br>
          <div class="tip-details-items">
            <button type="button">5%</button>
            <button type="button">10%</button>
            <button type="button">15%</button>
            <button type="button">25%</button>
            <button type="button">50%</button>
            <input type="text" name="customTip" id="customTip" placeholder="Custom">
          </div>


        </div>

        <div id="people-details">
          <label for="people">
            Number of People <span class="error-message"></span>
          </label>
          <br>
          <div class="input-wrapper">
            <img src="images/icon-person.svg" alt="person icon" class="input-icon">
            <input type="text" name="people" id="people" placeholder="0">
          </div>
        </div>
      </div>


      <div class="results-card">
        <div>
          <div id="tip-container">
            <div class="result-label">
              <p class="main-label">
                Tip Amount
              </p>

              <p class="unit">/ person</p>
            </div>

            <p id="tip-amount" class="result-amount">
              $0.00
            </p>
          </div>
          <div id="total-container">
            <div class="result-label">
              <p class="main-label">
                Total
              </p>

              <p class="unit">/ person</p>
            </div>

            <p id="total-amount" class="result-amount">
              $0.00
            </p>
          </div>
        </div>


        <button type="button" id="reset-button">RESET</button>


      </div>
    </form>
  </main>
</body>

</html>
