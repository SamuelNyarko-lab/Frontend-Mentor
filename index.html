<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style></style>
  </head>
  <body>
    <main class="card">
      <header class="card-image">
        <img src="assets/images/illustration-article.svg" alt="" />
      </header>

      <div class="learning">
        <p>Learning</p>
      </div>
      <p class="date">Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="languages">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <div class="footer">
        <div class="author-image">
          <img src="assets/images/image-avatar.webp" alt="Author image" />
        </div>

        <div class="author-name">
          <p>Greg Hooper</p>
        </div>
      </div>
    </main>
  </body>
</html>
