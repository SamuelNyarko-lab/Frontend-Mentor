<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/font.css">

  <title>Frontend Mentor | Tip calculator app</title>
  <script src="index.js" defer></script>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <header id="title">
    <img src="images/logo.svg" alt="">
  </header>

  <main id="contanier">
    <form action="" id="form">
      <div class="bill-details">
        <label for="bill">
          Bill
        </label>
        <br>
        <div class="input-wrapper">
          <img src="images/icon-dollar.svg" alt="dollar icon">
          <input type="text" name="bill" id="bill">

        </div>
      </div>

      <div class="tip-details">
        <label for="tip">Select Tip %</label>
        <button id="5">5%</button>
        <button id="10">10%</button>
        <button id="15">15%</button>
        <button id="25">25%</button>
        <button id="50">50%</button>
        <div class="input-wrapper">
          <img src="images/icon-person.svg" alt="person icon">
          <input type="text" name="tip" id="custom-tip" placeholder="Custom">
        </div>

      </div>

      <div id="people">
        <label for="people">
          Number of People
        </label>
        <br>
        <input type="text" name="people" id="people">
      </div>
    </form>
  </main>


  Tip Amount
  / person

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>

</html>
