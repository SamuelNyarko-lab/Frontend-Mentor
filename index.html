<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style></style>
  </head>
  <body>
    <!-- Sign-up form start -->

    <main>
      <div class="image">
        <!-- <img src="assets/images/illustration-sign-up-desktop.svg" alt="" /> -->
      </div>
      <div class="content">
        <h1 class="title">Stay updated!</h1>

        <p class="description">
          Join 60,000+ product managers receiving monthly updates on:
        </p>

        <ol>
          <li><span>Product discovery and building what matters</span></li>
          <li><span>Measuring to ensure updates are a success</span></li>
          <li><span>And much more!</span></li>
        </ol>

        <form action="#" novalidate>
          <div>
            <label for="email">Email address</label><br />
            <input
              type="email"
              placeholder="email@company.com"
              class="email-field"
              id="email"
            />
          </div>

          <button>Subscribe to monthly newsletter</button>
        </form>
      </div>
    </main>

    <!--  

     Sign-up form end -->

    <!-- Success message start 

    Thanks for subscribing! A confirmation email has been sent to
    ash@loremcompany.com. Please open it and click the button inside to confirm
    your subscription. Dismiss message

    Success message end 

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>-->
  </body>
</html>
